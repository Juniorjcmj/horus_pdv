# Perfil dos testes de integracao: banco real (Testcontainers) com Flyway; o resto igual a producao.
quack:
  dev: false
  sync:
    recuperacao-ativa: false   # os ITs da recuperacao a ligam; nos demais a rotina e a verificacao de versao ficam quietas
  fiscal:
    fila-minima:
      ativa: false   # os ITs da fila chamam processarLote() direto; nos demais a rotina nao mexe nas notas
  auth:
    jwt-secret: segredo-jwt-de-integracao-com-mais-de-32-caracteres
  security:
    encryption-key: chave-de-cifra-de-integracao-com-mais-de-32-caracteres
    rate-limit:
      max-requests: 5000
logging:
  level:
    org.flywaydb: WARN
    com.zaxxer: WARN
