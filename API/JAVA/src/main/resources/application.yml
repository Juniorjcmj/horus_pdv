# Perfil padrao = producao. O perfil "dev" equivale ao Development da API .NET (application-dev.yml).
spring:
  application:
    name: quack-pdv-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=HorusPDV;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        use_nationalized_character_data: true
        timezone:
          default_storage: NATIVE
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"
    validate-on-migrate: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      accept-case-insensitive-properties: true

server:
  port: ${PORT:8080}
  server-header: ""
  servlet:
    encoding:
      charset: UTF-8
      force-response: true   # Content-Type: application/json;charset=UTF-8, como o ASP.NET
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

quack:
  dev: false
  auth:
    jwt-secret: ${QUACK_AUTH_JWT_SECRET:}
    issuer: horus-pdv-api
    audience: horus-pdv-web
    session-hours: 8
    password-reset-token-minutes: 30
  security:
    encryption-key: ${QUACK_SECURITY_ENCRYPTION_KEY:}
    cors-origins: ${QUACK_SECURITY_CORS_ORIGINS:}
    trust-forwarded-headers: false
    max-request-body-bytes: 2000000
    rate-limit:
      window-seconds: 60
      max-requests: 240
  recaptcha:
    enabled: false
    secret-key: ""
    min-score: 0.5
  email:
    enabled: false
    port: 587
    enable-ssl: true
    from-name: Quack PDV

logging:
  level:
    root: INFO
    org.springframework: WARN
    br.com.quack: INFO
