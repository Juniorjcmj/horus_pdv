# Coletor de metricas da nuvem do Quack PDV (change api-java-monitoramento, M7).
# Le o receptor pela rede interna OrionNet; NAO tem rota publica no Traefik.
# O token de metricas vem do arquivo gravado pelo entrypoint.sh a partir da variavel METRICS_TOKEN.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: quack-sync
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["pdv-api-sync:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
