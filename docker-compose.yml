# Arquivo: docker-compose.yml
# Objetivo: stack de produção do Hórus PDV para deploy via Portainer, atrás do Traefik já
#           existente na rede "OrionNet". As imagens são publicadas pelo GitHub Actions em
#           ghcr.io (ver .github/workflows/docker-publish.yml) — este arquivo só consome.
# Entradas esperadas: variáveis de ambiente definidas no Portainer (Stacks > Environment
#           variables) ou num .env ao lado deste arquivo — ver .env.stack.example.
#
# depends_on é só uma lista simples (sem "condition: service_healthy") porque o Portainer em
# modo Swarm ("docker stack deploy") rejeita a sintaxe estendida de depends_on — só é aceita
# em endpoints Standalone (docker compose puro). O healthcheck do pdv-sqlserver abaixo continua
# útil para inspeção manual, mas não bloqueia a ordem de start. Isso é coberto pelo
# "restart: unless-stopped": se a API subir antes do SQL Server estar pronto, ela derruba e o
# Docker reinicia sozinho até conseguir conectar.

networks:
  OrionNet:
    external: true

volumes:
  horus-pdv-mssql-data:
  horus-pdv-backups:
  horus-pdv-prometheus-data:
  horus-pdv-grafana-data:

services:
  # Prepara só o volume de backups; SQL Server e API continuam com seus usuários não-root.
  pdv-backup-init:
    image: "mcr.microsoft.com/dotnet/aspnet:8.0"
    user: "0:0"
    restart: "no"
    deploy:
      restart_policy:
        condition: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 10001:0 /backups && chmod 2770 /backups"]
    volumes:
      - "horus-pdv-backups:/backups"
    network_mode: none

  pdv-sqlserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no ambiente do stack}"
    volumes:
      - "horus-pdv-mssql-data:/var/opt/mssql"
      - "horus-pdv-backups:/var/opt/mssql/backups"
    networks:
      - OrionNet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pdv-api:
    image: "ghcr.io/${GHCR_NAMESPACE:?defina GHCR_NAMESPACE no ambiente do stack, ex. seu-usuario-do-github}/horus-pdv-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      - pdv-sqlserver
      - pdv-backup-init
    group_add:
      - "0"
    volumes:
      - "horus-pdv-backups:/var/opt/horus/backups"
    environment:
      ConnectionStrings__HorusPdv: "Server=pdv-sqlserver,1433;Database=HorusPdv;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
      DatabaseBackup__StorageDirectory: "/var/opt/horus/backups"
      DatabaseBackup__SqlDirectory: "/var/opt/mssql/backups"
      Auth__JwtSecret: "${JWT_SECRET:?defina JWT_SECRET no ambiente do stack (string aleatória longa)}"
      Security__EncryptionKey: "${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no ambiente do stack — string aleatória longa e ESTÁVEL, nunca troque depois de configurar CSC ou certificado}"
      Security__CorsOrigins: "https://pdv.quacksistemas.com.br,https://pdv.wootchat.com.br"
      Security__TrustForwardedHeaders: "true"
      AllowedHosts: "${ALLOWED_HOSTS:-localhost;127.0.0.1;api-pdv.quacksistemas.com.br;pdv.quacksistemas.com.br;api-pdv.wootchat.com.br;pdv.wootchat.com.br;api.horuspdv.local}"
      Email__FrontendBaseUrl: "https://pdv.quacksistemas.com.br"
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__Host: "${EMAIL_HOST:-smtp-mail.outlook.com}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__EnableSsl: "${EMAIL_ENABLE_SSL:-true}"
      Email__User: "${EMAIL_USER:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromEmail: "${EMAIL_FROM:-}"
      Email__FromName: "Quack PDV"
      Recaptcha__Enabled: "${RECAPTCHA_ENABLED:-false}"
      Recaptcha__SecretKey: "${RECAPTCHA_SECRET_KEY:-}"
    networks:
      - OrionNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdv-api.rule=Host(`api-pdv.quacksistemas.com.br`)"
      - "traefik.http.routers.pdv-api.entrypoints=websecure"
      - "traefik.http.routers.pdv-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.pdv-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.pdv-api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.pdv-api.middlewares=pdv-api-headers"

  pdv-frontend:
    image: "ghcr.io/${GHCR_NAMESPACE:?defina GHCR_NAMESPACE no ambiente do stack, ex. seu-usuario-do-github}/horus-pdv-frontend:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      - pdv-api
    networks:
      - OrionNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdv.rule=Host(`pdv.quacksistemas.com.br`)"
      - "traefik.http.routers.pdv.entrypoints=websecure"
      - "traefik.http.routers.pdv.tls.certresolver=letsencrypt"
      - "traefik.http.services.pdv.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.pdv-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.pdv.middlewares=pdv-headers"

  # Receptor da sincronizacao das lojas (API Java em modo "nuvem": so /api/loja-sync/** e /actuator/health).
  # Fica FORA da subida normal: so sobe com o perfil "nuvem" (docker compose --profile nuvem up -d, ou
  # COMPOSE_PROFILES=nuvem no ambiente do stack). Usa o MESMO banco e os MESMOS segredos da pdv-api: valida o
  # administrador pelo JWT da .NET e decifra com a mesma chave. Ver DEPLOY.md, secao "Servidor da loja (sync-pdv)".
  # A primeira subida liga o Change Tracking e o isolamento snapshot no banco (db/nuvem/V1); reverter: desligar.sql.
  pdv-api-sync:
    profiles: ["nuvem"]
    image: "ghcr.io/${GHCR_NAMESPACE:?defina GHCR_NAMESPACE no ambiente do stack, ex. seu-usuario-do-github}/horus-pdv-api-java:${IMAGE_TAG_JAVA:-latest}"
    restart: unless-stopped
    depends_on:
      - pdv-sqlserver
      - pdv-api
    environment:
      SPRING_PROFILES_ACTIVE: "nuvem"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://pdv-sqlserver:1433;databaseName=HorusPdv;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no ambiente do stack}"
      QUACK_AUTH_JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no ambiente do stack (o mesmo da pdv-api)}"
      QUACK_SECURITY_ENCRYPTION_KEY: "${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no ambiente do stack (a mesma da pdv-api)}"
      QUACK_SECURITY_TRUST_FORWARDED_HEADERS: "true"
      QUACK_EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      QUACK_EMAIL_HOST: "${EMAIL_HOST:-smtp-mail.outlook.com}"
      QUACK_EMAIL_PORT: "${EMAIL_PORT:-587}"
      QUACK_EMAIL_ENABLE_SSL: "${EMAIL_ENABLE_SSL:-true}"
      QUACK_EMAIL_USER: "${EMAIL_USER:-}"
      QUACK_EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      QUACK_EMAIL_FROM_EMAIL: "${EMAIL_FROM:-}"
      # Token das metricas (/actuator/prometheus): o Prometheus (pdv-monitor-prometheus) usa o MESMO valor em METRICS_TOKEN.
      # Gere com: openssl rand -hex 32. Vazio = a rota de metricas nao existe (404).
      QUACK_METRICS_TOKEN: "${METRICS_TOKEN:?defina METRICS_TOKEN no ambiente do stack (openssl rand -hex 32)}"
      TZ: "America/Sao_Paulo"
    networks:
      - OrionNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync-pdv.rule=Host(`sync-pdv.quacksistemas.com.br`)"
      - "traefik.http.routers.sync-pdv.entrypoints=websecure"
      - "traefik.http.routers.sync-pdv.tls.certresolver=letsencrypt"
      - "traefik.http.services.sync-pdv.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.sync-pdv-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.sync-pdv.middlewares=sync-pdv-headers"

  # Monitoramento (change api-java-monitoramento): Prometheus coleta o receptor pela rede interna e o Grafana mostra os
  # paineis "Sincronizacao das lojas" e "API Java". Mesmo perfil do pdv-api-sync. Ver DEPLOY.md, secao "Monitoramento".
  # O Prometheus NAO tem labels do Traefik: sem rota publica. A imagem traz a configuracao (monitoramento/prometheus).
  pdv-monitor-prometheus:
    profiles: ["nuvem"]
    image: "ghcr.io/${GHCR_NAMESPACE:?defina GHCR_NAMESPACE no ambiente do stack, ex. seu-usuario-do-github}/quack-monitor-prometheus:${IMAGE_TAG_MONITOR:-spring-api}"
    restart: unless-stopped
    depends_on:
      - pdv-api-sync
    environment:
      METRICS_TOKEN: "${METRICS_TOKEN:?defina METRICS_TOKEN no ambiente do stack (o mesmo do pdv-api-sync)}"
      TZ: "America/Sao_Paulo"
    volumes:
      - "horus-pdv-prometheus-data:/prometheus"
    networks:
      - OrionNet
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana com login obrigatorio (sem acesso anonimo nem cadastro) atras do Traefik. A fonte de dados e os paineis vao
  # na imagem (monitoramento/grafana). Crie o DNS monitor-pdv.quacksistemas.com.br antes de subir.
  pdv-monitor-grafana:
    profiles: ["nuvem"]
    image: "ghcr.io/${GHCR_NAMESPACE:?defina GHCR_NAMESPACE no ambiente do stack, ex. seu-usuario-do-github}/quack-monitor-grafana:${IMAGE_TAG_MONITOR:-spring-api}"
    restart: unless-stopped
    depends_on:
      - pdv-monitor-prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no ambiente do stack (senha forte)}"
      GF_SERVER_ROOT_URL: "https://monitor-pdv.quacksistemas.com.br"
      GF_SERVER_DOMAIN: "monitor-pdv.quacksistemas.com.br"
      TZ: "America/Sao_Paulo"
    volumes:
      - "horus-pdv-grafana-data:/var/lib/grafana"
    networks:
      - OrionNet
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monitor-pdv.rule=Host(`monitor-pdv.quacksistemas.com.br`)"
      - "traefik.http.routers.monitor-pdv.entrypoints=websecure"
      - "traefik.http.routers.monitor-pdv.tls.certresolver=letsencrypt"
      - "traefik.http.services.monitor-pdv.loadbalancer.server.port=3000"
