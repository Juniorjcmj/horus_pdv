name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Verificar configuração do GitHub Pages
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const settingsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            const instructions = `Configure o repositório em ${settingsUrl}: Build and deployment > Source > GitHub Actions. Depois execute novamente Deploy Docs.`;
            let site;
            try {
              ({ data: site } = await github.rest.repos.getPages(context.repo));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.warning(`GitHub Pages indisponível para este token. ${instructions}`);
              await core.summary.addHeading('Documentação não publicada')
                .addRaw(`O GitHub não encontrou um site Pages acessível para este repositório. ${instructions}`)
                .write();
              return;
            }
            if (site.build_type !== 'workflow') {
              core.setOutput('enabled', 'false');
              core.warning(`GitHub Pages não está configurado para GitHub Actions. ${instructions}`);
              await core.summary.addHeading('Documentação não publicada')
                .addRaw(instructions).write();
              return;
            }
            core.setOutput('enabled', 'true');

  deploy:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
