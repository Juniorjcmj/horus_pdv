name: Build e publicar imagens Docker

# Publica as imagens da API e do frontend no GitHub Container Registry (ghcr.io) a cada
# push em main, e dispara o webhook de redeploy do Portainer se ele estiver configurado.
# Configuração necessária no repositório (Settings > Secrets and variables > Actions):
#   Secrets:   PORTAINER_WEBHOOK_URL (opcional), RECAPTCHA_SITE_KEY (opcional)
#   Variables: VITE_API_ORIGIN (opcional, default abaixo já aponta para api-pdv.wootchat.com.br)

on:
  push:
    branches: [main]
    paths:
      - "API/NETCORE/**"
      - "FRONTEND/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nome do dono da imagem (ghcr.io exige minúsculo)
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./API/NETCORE
          file: ./API/NETCORE/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nome do dono da imagem (ghcr.io exige minúsculo)
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FRONTEND
          file: ./FRONTEND/Dockerfile
          push: true
          build-args: |
            VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN || 'https://api-pdv.wootchat.com.br' }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: [build-api, build-frontend]
    runs-on: ubuntu-latest
    steps:
      # Portainer expõe um webhook por stack (Business Edition) ou um por serviço/container,
      # dependendo da versão/edição. PORTAINER_WEBHOOK_URL cobre o caso "um só, redeploya tudo";
      # se sua instância só tem webhook por serviço, configure também
      # PORTAINER_WEBHOOK_URL_FRONTEND para disparar o segundo. Nenhum secret configurado = pula
      # silenciosamente (redeploy manual pelo Portainer continua funcionando normalmente).
      - name: Disparar webhook(s) de redeploy do Portainer
        run: |
          fired=0
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
            fired=1
          fi
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_URL_FRONTEND }}" ]; then
            curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL_FRONTEND }}"
            fired=1
          fi
          if [ "$fired" -eq 0 ]; then
            echo "Nenhum PORTAINER_WEBHOOK_URL* configurado — pulei o redeploy automático. Puxe as imagens novas manualmente no Portainer."
          fi
