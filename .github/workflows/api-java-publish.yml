name: Publicar imagem da API Java (receptor da nuvem)

# Publica ghcr.io/<dono>/horus-pdv-api-java (latest + sha) a cada push em main que muda JAVA/api, ou sob demanda.
# E a imagem do servico "pdv-api-sync" do docker-compose.yml (perfil "nuvem", Traefik sync-pdv). Fica em workflow proprio
# para NAO disparar os builds da API .NET e do frontend (docker-publish.yml) nem o webhook de redeploy deles.
# Os testes rodam no workflow api-java.yml (branch spring-api); aqui so se constroi e publica a imagem.
# Como o docker-compose.yml faz pull dessa tag, o servico so passa a existir quando o perfil "nuvem" for ligado.

on:
  push:
    branches: [main]
    paths:
      - "JAVA/api/**"
      - ".github/workflows/api-java-publish.yml"
  workflow_dispatch:

concurrency:
  group: api-java-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nome do dono da imagem (ghcr.io exige minusculo)
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API Java
        uses: docker/build-push-action@v6
        with:
          context: JAVA/api
          file: JAVA/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-api-java:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/horus-pdv-api-java:${{ github.sha }}
          cache-from: type=gha,scope=api-java
          cache-to: type=gha,mode=max,scope=api-java
