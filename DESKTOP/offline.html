<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>Quack PDV — sem conexão</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0f172a; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 480px; padding: 32px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #94a3b8; line-height: 1.5; margin: 0 0 8px; }
      code { color: #fbbf24; font-size: 12px; }
      button {
        margin-top: 20px; padding: 10px 22px; border: 0; border-radius: 10px;
        background: #fbbf24; color: #0f172a; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #f59e0b; }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" />
      <h1>Não foi possível abrir o PDV</h1>
      <p>O computador está sem internet e o PDV ainda não foi aberto nenhuma vez nesta máquina.</p>
      <p>Depois da primeira abertura com internet, o PDV passa a abrir também sem conexão.</p>
      <p><code id="erro"></code></p>
      <button id="retry" type="button">Tentar novamente</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("erro").textContent = params.get("erro") || "";
      const target = params.get("url");
      document.getElementById("retry").addEventListener("click", () => {
        if (target) location.href = target;
      });
    </script>
  </body>
</html>
