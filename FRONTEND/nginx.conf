# Arquivo: FRONTEND/nginx.conf
# Objetivo: serve o build estático do Hórus PDV (SPA) atrás do Traefik.
# Entradas esperadas: substitui o default.conf da imagem nginx:1.27-alpine.
#
# Escuta em 8080 (não 80) para bater com "traefik.http.services.<...>.loadbalancer.server.port=8080".
# A terminação HTTPS/redirecionamento é feita pelo Traefik; aqui é só HTTP puro dentro da rede Docker.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo sem risco de servir versão velha.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html nunca deve ser cacheado — é ele que referencia os assets com hash da versão atual.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Roteamento é todo client-side (estado em localStorage, não em URL) — qualquer caminho cai no SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
